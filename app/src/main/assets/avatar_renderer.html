<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avatar Renderer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
    background: transparent;
  }
  #status {
    position: fixed;
    bottom: 4px; left: 0; right: 0;
    text-align: center;
    font: 10px/1.4 monospace;
    color: rgba(255,255,255,0.7);
    pointer-events: none;
    text-shadow: 0 1px 3px #000;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three":              "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/":      "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/",
    "@pixiv/three-vrm":   "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.2/lib/three-vrm.module.min.js"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">Loading…</div>

<script type="module">
import * as THREE                        from 'three';
import { GLTFLoader }                    from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils }     from '@pixiv/three-vrm';

const statusEl = document.getElementById('status');
function setStatus(msg) { statusEl.textContent = msg; }

function notifyKotlin(method, arg) {
  try { window.AndroidBridge[method](arg); } catch (_) {}
}

const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20);
let currentFraming = 'bust';
setCameraFraming('bust');

scene.add(new THREE.HemisphereLight(0xffffff, 0x8888aa, 0.8));
const keyLight = new THREE.DirectionalLight(0xfff5e0, 1.2);
keyLight.position.set(1.2, 2, 1.5);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xc0d8ff, 0.4);
fillLight.position.set(-1.5, 1, -1);
scene.add(fillLight);

const loader = new GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser, { autoUpdateHumanBones: true }));

let currentVRM   = null;
let currentModel = null;
const clock = new THREE.Clock();
const idle  = {
  breathPhase: 0, blinkTimer: 0, nextBlink: 3,
  blinkActive: false, blinkT: 0
};
let activeExpressionName   = null;
let activeExpressionWeight = 0;

window.AvatarAPI = {

  loadModel(url) {
    setStatus('Loading…');

    if (currentModel) {
      scene.remove(currentModel);
      if (currentVRM) VRMUtils.deepDispose(currentVRM.scene);
      currentVRM = null;
      currentModel = null;
    }

    loader.load(
      url,
      gltf => {
        try {
          const vrm = gltf.userData.vrm;
          if (!vrm) {
            currentModel = gltf.scene;
            scene.add(currentModel);
            fitModel(currentModel);
            setStatus('');
            notifyKotlin('onModelLoaded', gltf.scene.name || 'model.glb');
            return;
          }
          currentVRM   = vrm;
          currentModel = vrm.scene;
          VRMUtils.rotateVRM0(vrm);
          scene.add(currentModel);
          Object.assign(idle, {
            breathPhase: 0, blinkTimer: 0, nextBlink: 3,
            blinkActive: false, blinkT: 0
          });
          // ── T-pose fix: arms start at bind pose (hands straight out).
          // applyRelaxedPose() sets the initial rest position.
          // tickIdle() re-applies it every frame so vrm.update() can't reset it.
          applyRelaxedPose(vrm);
          activeExpressionName = null;
          activeExpressionWeight = 0;
          setCameraFraming(currentFraming);
          setStatus('');
          const name = vrm.meta?.title || vrm.meta?.name || 'avatar.vrm';
          notifyKotlin('onModelLoaded', name);
        } catch (e) {
          setStatus('Error: ' + e.message);
          notifyKotlin('onModelError', e.message);
        }
      },
      xhr => {
        if (xhr.total) {
          setStatus('Loading… ' + Math.round(xhr.loaded / xhr.total * 100) + '%');
        }
      },
      err => {
        const msg = err?.message || String(err);
        setStatus('Error: ' + msg);
        notifyKotlin('onModelError', msg);
      }
    );
  },

  playExpression(name, weight, durationSec) {
    if (!currentVRM?.expressionManager) return;
    activeExpressionName   = name;
    activeExpressionWeight = weight;
    if (durationSec > 0) {
      setTimeout(() => {
        if (activeExpressionName === name) {
          activeExpressionName = null;
          activeExpressionWeight = 0;
        }
      }, durationSec * 1000);
    }
  },

  resetExpression() {
    activeExpressionName = null;
    activeExpressionWeight = 0;
    if (!currentVRM?.expressionManager) return;
    ['happy','angry','sad','surprised','relaxed',
     'blink','blinkLeft','blinkRight','aa','ih','ou','ee','oh']
      .forEach(n => { try { currentVRM.expressionManager.setValue(n, 0); } catch (_) {} });
  },

  lookAt(nx, ny) {
    if (!currentVRM?.lookAt) return;
    currentVRM.lookAt.target = new THREE.Vector3((nx - 0.5) * 2, -(ny - 0.5) * 2 + 1.5, 2);
  },

  setFraming(mode) { setCameraFraming(mode); }
};

function setCameraFraming(mode) {
  currentFraming = mode;
  if      (mode === 'full') { camera.position.set(0, 0.9,  3.2); camera.lookAt(0, 0.9,  0); }
  else if (mode === 'face') { camera.position.set(0, 1.55, 0.9); camera.lookAt(0, 1.55, 0); }
  else                      { camera.position.set(0, 1.35, 1.8); camera.lookAt(0, 1.35, 0); }
}

function fitModel(model) {
  const box    = new THREE.Box3().setFromObject(model);
  const centre = box.getCenter(new THREE.Vector3());
  const size   = box.getSize(new THREE.Vector3());
  const dist   = Math.max(size.x, size.y, size.z) /
                 (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  camera.position.set(centre.x, centre.y, centre.z + dist * 1.2);
  camera.lookAt(centre);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function tickIdle(delta) {
  if (!currentVRM) return;
  const em = currentVRM.expressionManager;
  const hb = currentVRM.humanoid;

  idle.breathPhase += delta * 0.35;
  const b = Math.sin(idle.breathPhase * Math.PI * 2) * 0.025;
  if (hb) {
    // Spine/chest/head — breath sway
    applyBone(hb, 'spine', b, 0, 0);
    applyBone(hb, 'chest', b * 0.4, 0, 0);
    applyBone(hb, 'head',
      Math.sin(idle.breathPhase * Math.PI * 2 * 0.5)  * 0.012,
      Math.sin(idle.breathPhase * Math.PI * 2 * 0.37) * 0.008,
      0
    );
    // Arms — re-applied every frame so vrm.update() cannot reset to bind pose.
    // Subtle idle sway added on top of the relaxed position.
    const armSway = Math.sin(idle.breathPhase * Math.PI * 2 * 0.5) * 0.015;
    applyBone(hb, 'leftUpperArm',  0, armSway,   1.15);
    applyBone(hb, 'rightUpperArm', 0, -armSway, -1.15);
    applyBone(hb, 'leftLowerArm',  0, 0,         0.25);
    applyBone(hb, 'rightLowerArm', 0, 0,        -0.25);
  }
  if (em) {
    idle.blinkTimer += delta;
    if (!idle.blinkActive && idle.blinkTimer >= idle.nextBlink) {
      idle.blinkActive = true;
      idle.blinkT      = 0;
      idle.nextBlink   = idle.blinkTimer + 2.5 + Math.random() * 4;
    }
    if (idle.blinkActive) {
      idle.blinkT += delta;
      const D = 0.12;
      let w = idle.blinkT < D * 0.5
        ? idle.blinkT / (D * 0.5)
        : idle.blinkT < D
          ? 1 - (idle.blinkT - D * 0.5) / (D * 0.5)
          : 0;
      if (idle.blinkT >= D) { w = 0; idle.blinkActive = false; }
      ['blink','blinkLeft','blinkRight'].forEach(n => safeSet(em, n, w));
    } else {
      ['blink','blinkLeft','blinkRight'].forEach(n => safeSet(em, n, 0));
    }
    if (activeExpressionName) safeSet(em, activeExpressionName, activeExpressionWeight);
  }
}

function applyBone(hb, name, rx, ry, rz) {
  try {
    const b = hb.getNormalizedBoneNode(name);
    if (b) { b.rotation.x = rx; b.rotation.y = ry; b.rotation.z = rz; }
  } catch (_) {}
}
function safeSet(em, name, v) {
  try { em.setValue(name, v); } catch (_) {}
}

// ─── Relaxed pose ─────────────────────────────────────────────────────────────
// Sets arms to a natural resting position immediately after model load.
// Called once on load; tickIdle() re-applies arms every frame to prevent reset.
function applyRelaxedPose(vrm) {
  const hb = vrm.humanoid;
  if (!hb) return;
  const leftUpper  = hb.getNormalizedBoneNode('leftUpperArm');
  const rightUpper = hb.getNormalizedBoneNode('rightUpperArm');
  const leftLower  = hb.getNormalizedBoneNode('leftLowerArm');
  const rightLower = hb.getNormalizedBoneNode('rightLowerArm');
  if (leftUpper)  { leftUpper.rotation.set(0,  0,  1.15); }
  if (rightUpper) { rightUpper.rotation.set(0, 0, -1.15); }
  if (leftLower)  { leftLower.rotation.set(0,  0,  0.25); }
  if (rightLower) { rightLower.rotation.set(0, 0, -0.25); }
}

// ─── Render loop ──────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  if (currentVRM) { tickIdle(delta); currentVRM.update(delta); }
  renderer.render(scene, camera);
}

window.addEventListener('error',              e => notifyKotlin('onModelError', e.message));
window.addEventListener('unhandledrejection', e => notifyKotlin('onModelError', String(e.reason)));

setStatus('');
animate();
notifyKotlin('onRendererReady', '');
</script>
</body>
</html>
