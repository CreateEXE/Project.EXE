<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avatar Renderer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
    background: transparent;
  }
  #status {
    position: fixed;
    bottom: 4px; left: 0; right: 0;
    text-align: center;
    font: 10px/1.4 monospace;
    color: rgba(255,255,255,0.7);
    pointer-events: none;
    text-shadow: 0 1px 3px #000;
    max-width: 90%;
    margin: 0 auto;
  }
  #debug {
    position: fixed;
    top: 4px; right: 4px;
    max-width: 200px;
    max-height: 150px;
    background: rgba(0,0,0,0.8);
    color: #0f0;
    font: 8px/1.2 monospace;
    padding: 4px;
    border: 1px solid #0f0;
    overflow-y: auto;
    pointer-events: none;
    border-radius: 4px;
    z-index: 9999;
  }
  .debug-line { display: block; }
  .debug-error { color: #f00; }
  .debug-success { color: #0f0; }
  .debug-warning { color: #ff0; }
  .debug-info { color: #0ff; }
</style>

<!--
  importmap resolved by the CI/build step which copies these files into assets/js/.
  Paths are relative to the HTML file inside file:///android_asset/.
-->
<script type="importmap">
{
  "imports": {
    "three":          "./js/three.module.js",
    "three/addons/":  "./js/",
    "@pixiv/three-vrm": "./js/three-vrm.module.min.js"
  }
}
</script>
</head>
<body>

<canvas id="c"></canvas>
<div id="status">Loading…</div>
<div id="debug"></div>

<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
// Debug logging utilities
// ─────────────────────────────────────────────────────────────────────────────
const debugEl = document.getElementById('debug');
const debugLog = [];
const MAX_LOG_LINES = 12;

function addDebugLine(msg, type = 'info') {
  debugLog.push({ msg, type });
  if (debugLog.length > MAX_LOG_LINES) debugLog.shift();
  
  const html = debugLog.map(({msg, type}) => 
    `<span class="debug-line debug-${type}">${msg}</span>`
  ).join('<br>');
  
  debugEl.innerHTML = html;
  console.log(`[${type.toUpperCase()}] ${msg}`);
}

// ─────────────────────────────────────────────────────────────────────────────
// Imports
// ─────────────────────────────────────────────────────────────────────────────
addDebugLine('Boot: Loading modules...', 'info');

import * as THREE from 'three';
addDebugLine('✓ THREE loaded', 'success');

import { GLTFLoader }   from 'three/addons/GLTFLoader.js';
addDebugLine('✓ GLTFLoader loaded', 'success');

import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
addDebugLine('✓ VRM plugin loaded', 'success');

// ─────────────────────────────────────────────────────────────────────────────
// Renderer setup — transparent background
// ─────────────────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('c');
const statusEl = document.getElementById('status');

addDebugLine('Init: WebGL setup...', 'info');

const renderer = new THREE.WebGLRenderer({
  canvas,
  alpha:      true,
  antialias:  true,
  powerPreference: 'high-performance',
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = false;

addDebugLine(`✓ WebGL ${renderer.capabilities.isWebGL2 ? '2.0' : '1.0'}`, 'success');

// ─────────────────────────────────────────────────────────────────────────────
// Scene & Camera
// ─────────────────────────────────────────────────────────────────────────────
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(
  30,
  window.innerWidth / window.innerHeight,
  0.1,
  20
);

setCameraFraming('bust');
addDebugLine('✓ Scene initialized', 'success');

// Lighting
const hemi = new THREE.HemisphereLight(0xffffff, 0x8888aa, 0.8);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff5e0, 1.2);
key.position.set(1.2, 2, 1.5);
scene.add(key);

const fill = new THREE.DirectionalLight(0xc0d8ff, 0.4);
fill.position.set(-1.5, 1, -1);
scene.add(fill);

addDebugLine('✓ Lighting added', 'success');

// ─────────────────────────────────────────────────────────────────────────────
// VRM state
// ─────────────────────────────────────────────────────────────────────────────
let currentVRM   = null;
let currentModel = null;
const clock = new THREE.Clock();

const idle = {
  breathPhase:   0,
  blinkTimer:    0,
  nextBlink:     3.0,
  blinkActive:   false,
  blinkT:        0,
};

let activeExpressionName   = null;
let activeExpressionWeight = 0;

// ─────────────────────────────────────────────────────────────────────────────
// GLTFLoader with VRM plugin
// ─────────────────────────────────────────────────────────────────────────────
const loader = new GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser, {
  autoUpdateHumanBones: true,
}));

addDebugLine('✓ GLTFLoader ready', 'success');

// ─────────────────────────────────────────────────────────────────────────────
// Public API — called by Kotlin via evaluateJavascript()
// ─────────────────────────────────────────────────────────────────────────────
window.AvatarAPI = {

  loadModel(dataUri) {
    addDebugLine('loadModel: Starting...', 'info');
    setStatus('Loading model…');

    // Remove old model
    if (currentModel) {
      scene.remove(currentModel);
      if (currentVRM) VRMUtils.deepDispose(currentVRM.scene);
      currentVRM   = null;
      currentModel = null;
      addDebugLine('Cleaned old model', 'info');
    }

    const uriPreview = dataUri.substring(0, Math.min(50, dataUri.length));
    addDebugLine(`URI: ${uriPreview}...`, 'info');

    loader.load(
      dataUri,
      gltf => {
        try {
          const vrm = gltf.userData.vrm;
          addDebugLine('gltf loaded', 'success');
          
          if (!vrm) {
            addDebugLine('Plain GLB/GLTF (no VRM)', 'warning');
            currentModel = gltf.scene;
            scene.add(currentModel);
            fitModelToView(currentModel);
            setStatus('');
            addDebugLine('✓ GLB loaded', 'success');
            notifyKotlin('onModelLoaded', gltf.scene.name || 'model.glb');
            return;
          }

          addDebugLine('VRM detected', 'success');
          currentVRM   = vrm;
          currentModel = vrm.scene;

          VRMUtils.rotateVRM0(vrm);
          addDebugLine('VRM rotated', 'info');

          scene.add(currentModel);

          Object.assign(idle, {
            breathPhase: 0, blinkTimer: 0, nextBlink: 3,
            blinkActive: false, blinkT: 0,
          });
          activeExpressionName   = null;
          activeExpressionWeight = 0;

          setCameraFraming(currentFraming);
          addDebugLine('Camera set', 'info');

          setStatus('');
          const modelName = vrm.meta?.title || vrm.meta?.name || 'avatar.vrm';
          addDebugLine(`✓ Model: ${modelName}`, 'success');
          notifyKotlin('onModelLoaded', modelName);
        } catch (e) {
          const msg = e?.message || String(e);
          addDebugLine(`✗ Error in load callback: ${msg}`, 'error');
          setStatus('Error: ' + msg);
          notifyKotlin('onModelError', msg);
        }
      },
      xhr => {
        if (xhr.total) {
          const pct = Math.round(xhr.loaded / xhr.total * 100);
          setStatus(`Loading… ${pct}%`);
          if (pct % 25 === 0) addDebugLine(`Progress: ${pct}%`, 'info');
        }
      },
      err => {
        const msg = err?.message || String(err);
        addDebugLine(`✗ Load error: ${msg}`, 'error');
        console.error('VRM load error:', err);
        setStatus('Error: ' + msg);
        notifyKotlin('onModelError', msg);
      }
    );
  },

  playExpression(name, weight = 1.0, durationSec = 2.0) {
    addDebugLine(`expr: ${name} (${(weight*100).toFixed(0)}%)`, 'info');
    if (!currentVRM?.expressionManager) {
      addDebugLine('No expression manager', 'warning');
      return;
    }
    activeExpressionName   = name;
    activeExpressionWeight = weight;
    if (durationSec > 0) {
      setTimeout(() => {
        if (activeExpressionName === name) {
          activeExpressionName   = null;
          activeExpressionWeight = 0;
        }
      }, durationSec * 1000);
    }
  },

  resetExpression() {
    addDebugLine('Reset expressions', 'info');
    activeExpressionName   = null;
    activeExpressionWeight = 0;
    if (currentVRM?.expressionManager) {
      for (const name of ['happy','angry','sad','surprised','relaxed','blink','blinkLeft','blinkRight','aa','ih','ou','ee','oh']) {
        try { currentVRM.expressionManager.setValue(name, 0); } catch(_) {}
      }
    }
  },

  lookAt(normX, normY) {
    if (!currentVRM?.lookAt) return;
    const worldX = (normX - 0.5) * 2;
    const worldY = -(normY - 0.5) * 2;
    currentVRM.lookAt.target = new THREE.Vector3(worldX, worldY + 1.5, 2);
  },

  setFraming(mode) {
    addDebugLine(`Frame: ${mode}`, 'info');
    setCameraFraming(mode);
  },
};

// ─────────────────────────────────────────────────────────────────────────────
// Camera framing helpers
// ─────────────────────────────────────────────────────────────────────────────
let currentFraming = 'bust';

function setCameraFraming(mode) {
  currentFraming = mode;
  switch (mode) {
    case 'full':
      camera.position.set(0, 0.9, 3.2);
      camera.lookAt(0, 0.9, 0);
      break;
    case 'face':
      camera.position.set(0, 1.55, 0.9);
      camera.lookAt(0, 1.55, 0);
      break;
    case 'bust':
    default:
      camera.position.set(0, 1.35, 1.8);
      camera.lookAt(0, 1.35, 0);
      break;
  }
}

function fitModelToView(model) {
  const box = new THREE.Box3().setFromObject(model);
  const centre = box.getCenter(new THREE.Vector3());
  const size   = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const dist   = maxDim / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  camera.position.set(centre.x, centre.y, centre.z + dist * 1.2);
  camera.lookAt(centre);
}

// ─────────────────────────────────────────────────────────────────────────────
// Resize handler
// ─────────────────────────────────────────────────────────────────────────────
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

// ─────────────────────────────────────────────────────────────────────────────
// Procedural idle animation tick
// ─────────────────────────────────────────────────────────────────────────────
function tickIdle(delta) {
  if (!currentVRM) return;
  const em = currentVRM.expressionManager;
  const hb = currentVRM.humanoid;

  idle.breathPhase += delta * 0.35;
  const breathAmt = Math.sin(idle.breathPhase * Math.PI * 2) * 0.025;

  if (hb) {
    applyBoneEuler(hb, 'spine', breathAmt, 0, 0);
    applyBoneEuler(hb, 'chest', breathAmt * 0.4, 0, 0);

    const headNod = Math.sin(idle.breathPhase * Math.PI * 2 * 0.5)  * 0.012;
    const headYaw = Math.sin(idle.breathPhase * Math.PI * 2 * 0.37) * 0.008;
    applyBoneEuler(hb, 'head', headNod, headYaw, 0);
  }

  if (em) {
    idle.blinkTimer += delta;
    if (!idle.blinkActive && idle.blinkTimer >= idle.nextBlink) {
      idle.blinkActive = true;
      idle.blinkT      = 0;
      idle.nextBlink   = idle.blinkTimer + 2.5 + Math.random() * 4.0;
    }

    if (idle.blinkActive) {
      idle.blinkT += delta;
      const BLINK_DUR = 0.12;
      let blinkW;
      if (idle.blinkT < BLINK_DUR * 0.5) {
        blinkW = idle.blinkT / (BLINK_DUR * 0.5);
      } else if (idle.blinkT < BLINK_DUR) {
        blinkW = 1 - (idle.blinkT - BLINK_DUR * 0.5) / (BLINK_DUR * 0.5);
      } else {
        blinkW = 0;
        idle.blinkActive = false;
      }
      safeSetExpression(em, 'blink',      blinkW);
      safeSetExpression(em, 'blinkLeft',  blinkW);
      safeSetExpression(em, 'blinkRight', blinkW);
    } else {
      safeSetExpression(em, 'blink',      0);
      safeSetExpression(em, 'blinkLeft',  0);
      safeSetExpression(em, 'blinkRight', 0);
    }

    if (activeExpressionName) {
      safeSetExpression(em, activeExpressionName, activeExpressionWeight);
    }
  }
}

function applyBoneEuler(humanoid, boneName, rx, ry, rz) {
  try {
    const bone = humanoid.getNormalizedBoneNode(boneName);
    if (!bone) return;
    bone.rotation.x = rx;
    bone.rotation.y = ry;
    bone.rotation.z = rz;
  } catch (_) {}
}

function safeSetExpression(em, name, value) {
  try { em.setValue(name, value); } catch(_) {}
}

// ─────────────────────────────────────────────────────────────────────────────
// Render loop
// ─────────────────────────────────────────────────────────────────────────────
let frameCount = 0;
function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);

  frameCount++;
  if (frameCount % 60 === 0 && currentModel) {
    addDebugLine(`FPS: ${(1/delta).toFixed(0)} | Rendering...`, 'info');
  }

  if (currentVRM) {
    tickIdle(delta);
    currentVRM.update(delta);
  }

  renderer.render(scene, camera);
}

// ─────────────────────────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────────────────────────
function setStatus(msg) {
  statusEl.textContent = msg;
}

function notifyKotlin(method, arg) {
  try {
    addDebugLine(`→ Kotlin.${method}(...)`, 'info');
    window.AndroidBridge[method](arg);
  } catch(e) {
    addDebugLine(`✗ Bridge unavail: ${method}`, 'warning');
  }
}

// Catch any unhandled errors
window.addEventListener('error', (event) => {
  addDebugLine(`✗ JS Error: ${event.message}`, 'error');
});

window.addEventListener('unhandledrejection', (event) => {
  addDebugLine(`✗ Unhandled Promise: ${event.reason}`, 'error');
});

function onReady() {
  addDebugLine('✓ Renderer READY!', 'success');
  setStatus('');
  animate();
  notifyKotlin('onRendererReady', '');
}

// Wait for DOM + importmap resolution
if (document.readyState === 'complete') {
  onReady();
} else {
  window.addEventListener('load', onReady);
}
</script>
</body>
</html>
