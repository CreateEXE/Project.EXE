name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false   # llama.cpp cloned separately below (faster, shallow)

      # ── 2. Clone llama.cpp (shallow) ───────────────────────────────────────
      - name: Clone llama.cpp
        run: |
          git clone --depth=1 \
            https://github.com/ggml-org/llama.cpp \
            app/src/main/cpp/llama.cpp
          # Remove the app example to prevent build-info.h compilation error
          rm -rf app/src/main/cpp/llama.cpp/app

      # ── 3. Java 17 ────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 4. Gradle 8.6 ─────────────────────────────────────────────────────
      - name: Set executable permissions
        run: chmod +x ./gradlew

      # ── 5. Build Debug APK ─────────────────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # ── 6. Upload APK artifact ─────────────────────────────────────────────
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 7. Comment on PR with download link ────────────────────────────────
      - name: Comment APK link on PR
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Build successful! Download APK from [Actions artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            })
